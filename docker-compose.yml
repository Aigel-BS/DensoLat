version: '3.8'

services:
  web:
    build: .
    ports:
      - "4202:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:5.7
    platform: linux/amd64
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: denso_latam
      MYSQL_USER: denso_user
      MYSQL_PASSWORD: denso_password
    volumes:
      - db_data:/var/lib/mysql
      - "/Users/cesar/Desktop/denso_latam_2026-07-12.sql:/docker-entrypoint-initdb.d/init.sql:ro"

volumes:
  db_data:
