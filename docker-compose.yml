version: '3.8'

services:
  web:
    build: .
    ports:
      - "8085:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:5.7
    platform: linux/amd64
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: denso_latam
      MYSQL_USER: denso_user
      MYSQL_PASSWORD: denso_password
    volumes:
      - db_data:/var/lib/mysql
      - "/Volumes/SSDEXT/Trabajo/Empresas/Aigel/Clientes/Denso/Backup/2026/densolatam_11-06-26_(2).sql:/docker-entrypoint-initdb.d/init.sql:ro"

volumes:
  db_data:
